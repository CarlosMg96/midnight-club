services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    ports:
      - '5173:5173'
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/home/node/.local/share/pnpm/store

volumes:
  node_modules:
  pnpm_store:
